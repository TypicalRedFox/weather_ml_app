name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Run this workflow after CI finishes successfully on main -JL
permissions:
  contents: read

concurrency:
  group: weather-ml-production
  cancel-in-progress: false


# Deploy automatically only when CI succeeded.
# Manual runs can also proceed. -JL
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, linux]

    steps:
      - name: Check out the CI-passed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}


#Check which Kubernetes context the runner will use then verify that it can communicate with the cluster. -JL


      - name: Verify Kubernetes access
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Deploy and wait for rolling update
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Missing GitHub secret: DOCKERHUB_USERNAME" >&2
            exit 1
          fi

          kubectl apply -f k8s/
          kubectl set image deployment/weather-ml-deployment \
            weather-ml-container="$DOCKERHUB_USERNAME/weather_ml_app:v1"

          #WM - adding this to force a restart of the deployment so that it takes the new image
          kubectl rollout restart deployment/weather-ml-deployment

          kubectl rollout status deployment/weather-ml-deployment \
            --timeout=180s
