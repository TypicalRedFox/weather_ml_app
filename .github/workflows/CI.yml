name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-test-ship:
    runs-on: ubuntu-latest

    steps:
      # a - detect changes in the repo and check out
      - name: Checkout
        uses: actions/checkout@v4

      # b - installing flask and other dependencies listed in requirements.txt
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install --no-cache-dir -r requirements.txt

      # c - running all 3 types of tests
      - name: Smoke Test
        run: |
          export PYTHONPATH=$(pwd)
          python3 tests/smoke_test.py

      - name: Unit Test
        run: |
          export PYTHONPATH=$(pwd)
          python3 tests/unit_test.py

      - name: Integration Test
        run: |
          export PYTHONPATH=$(pwd)
          python3 tests/integration_test.py

      # d - building docker image
      - name: Setting up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/weather_ml_app:latest .

      # e - launching a test container to verify functionality
      - name: Build test
        run: |
          docker run -d --name weather-test -p 5000:5000 ${{ secrets.DOCKERHUB_USERNAME }}/weather_ml_app:latest
          sleep 5
          docker exec weather-test echo "the container is up and running!"
          docker stop weather-test
          docker rm weather-test

      # f - pushing the image to dockerhub
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/weather_ml_app:latest