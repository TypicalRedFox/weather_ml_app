name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-test-ship:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Integration Test
        run: PYTHONPATH=. python3 tests/integration_test.py

      # - name: Unit Test
      #   run: PYTHONPATH=. python3 tests/unit_test.py

      - name: Smoke Test
        run: PYTHONPATH=. python3 tests/smoke_test.py

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/weather_ml_app
