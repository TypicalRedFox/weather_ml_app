# WM - creating a kubernetes deployment that will manage pod creation, instances, replacements of failed pods
# and rolling out updates
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-ml-deployment
spec:
  # WM - keeping 3 instances of pods for the application
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # WM - only one pod can be unavailable at the very maximum, and it can max out at 4 pods.
      maxUnavailable: 1
      maxSurge: 1
  # WM - select the pods with weather-ml for management
  selector:
    matchLabels:
      app: weather-ml
  # WM - kubernetes blueprint for when new pods are created
  template:
    metadata:
      # WM - label applied to new pods created in the deployment
      labels:
        app: weather-ml
    # WM - relevant docker image that has the application in it
    # added some extra security so that it can retry and rerun if kube fails
    spec:
      containers:
        - name: weather-ml-container
          image: williammcsh04/weather_ml_app:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
